name: Release

# A tag builds the distributable, proves it installs into a pristine harness home,
# and publishes it. The install proof is the point: `install.sh` is what a user
# runs, so a release that cannot be installed is not a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: package, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-harness

      - name: Full local suite before packaging
        run: |
          node scripts/check-syntax.mjs
          node test/unit.test.mjs
          node test/windows-client.test.mjs
          node test/install.test.mjs

      - name: Build the distributable
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION" || VERSION="0.0.0-dev"
          mkdir -p dist
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' \
              --exclude='./.github' --exclude='./test' \
              -czf "dist/dsh-remote-ssh-${VERSION}.tar.gz" \
              ./README.md ./LICENSE ./CONTRIBUTING.md ./SECURITY.md \
              ./install.sh ./install.mjs ./patch ./packages
          (cd dist && shasum -a 256 "dsh-remote-ssh-${VERSION}.tar.gz" > "dsh-remote-ssh-${VERSION}.tar.gz.sha256")
          ls -la dist

      - name: Prove the distributable installs (and refuses to install twice)
        run: |
          set -eu
          export DSH_HOME="$RUNNER_TEMP/release-home"
          # The installer refuses to write before it has confirmed the harness
          # module tree is reachable from the destination — the one requirement
          # whose absence is otherwise silent until boot. A pristine home has no
          # such tree, so the workspace's linked packages stand in for it, which
          # is exactly what the loader will resolve at boot.
          mkdir -p "$DSH_HOME/profiles/web" "$DSH_HOME/profiles/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules/@deepseek-ai" "$DSH_HOME/profiles/node_modules/@deepseek-ai"
          tar -xzf dist/dsh-remote-ssh-*.tar.gz -C "$RUNNER_TEMP"
          node "$RUNNER_TEMP/install.mjs" --dsh-home "$DSH_HOME" > "$RUNNER_TEMP/install.log" 2>&1
          test -f "$DSH_HOME/profiles/plugins/dsh-remote-ssh/lib/registry.js"
          grep -q 'id: remote-ssh' "$DSH_HOME/cordis.patch.yml"
          # The YAML shape, not the report text: settings.yaml is a document.
          grep -q '^  enabled: true$' "$DSH_HOME/settings.yaml"
          # The verification phase really imported the host module; that row is
          # printed only when the import succeeded. Match the stable part of the
          # sentence, not its punctuation: the report pads rows with dots.
          grep -q 'registry.js exports RemoteRegistry' "$RUNNER_TEMP/install.log"
          node "$RUNNER_TEMP/install.mjs" --dsh-home "$DSH_HOME" > /dev/null 2>&1
          test "$(grep -c '# >>> dsh-remote-ssh' "$DSH_HOME/cordis.patch.yml")" = "1"
          # The same tarball must also install dormant on request, which is the
          # path a fleet rollout uses.
          DORMANT="$RUNNER_TEMP/dormant-home"
          mkdir -p "$DORMANT/profiles/web" "$DORMANT/profiles/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules/@deepseek-ai" "$DORMANT/profiles/node_modules/@deepseek-ai"
          node "$RUNNER_TEMP/install.mjs" --dsh-home "$DORMANT" --keep-off > /dev/null 2>&1
          grep -q '^  enabled: false$' "$DORMANT/settings.yaml"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dsh-remote-ssh $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload the artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-ssh-dist
          path: dist/*
          if-no-files-found: error
