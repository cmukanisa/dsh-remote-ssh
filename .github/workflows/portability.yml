name: Portability

# Checks that would only fail on SOME machine. The plugin ships plain JavaScript
# with no build step and no dependencies of its own, so every avoidable breakage
# is environmental: a shell script that only runs under bash, a YAML template the
# loader would reject, an absolute path baked into a file, or a Node API that is
# newer than the oldest supported runtime.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-matrix:
    name: supported Node (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/setup-harness
      - run: node test/unit.test.mjs

  shell:
    name: installer shell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The home the action prepares is what makes the installer's own
      # requirement checks satisfiable: it needs a profiles directory and the
      # harness module tree reachable from the install location.
      - uses: ./.github/actions/setup-harness
      - name: install.sh must be POSIX sh, not bash
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --shell=sh --severity=warning install.sh
      - name: install.sh must run under dash
        run: |
          set -eu
          # dash is the strictest common POSIX shell; a bashism fails here.
          dash -n install.sh
      - name: install.sh must install for real, and only once
        run: |
          set -eu
          # The shell script is the entry point a user pipes into `sh`, so this
          # exercises IT rather than install.mjs: a real install into a throwaway
          # home, twice, with the managed block still appearing exactly once.
          export DSH_HOME="$RUNNER_TEMP/shell-home"
          mkdir -p "$DSH_HOME/profiles/web" "$DSH_HOME/profiles/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules/@deepseek-ai" "$DSH_HOME/profiles/node_modules/@deepseek-ai"
          sh ./install.sh --dsh-home "$DSH_HOME" > "$RUNNER_TEMP/first.log" 2>&1 || { cat "$RUNNER_TEMP/first.log"; exit 1; }
          test -f "$DSH_HOME/profiles/plugins/dsh-remote-ssh/lib/registry.js"
          grep -q 'remote-ssh.enabled = true' "$RUNNER_TEMP/first.log"
          sh ./install.sh --dsh-home "$DSH_HOME" > /dev/null 2>&1
          test "$(grep -c '# >>> dsh-remote-ssh' "$DSH_HOME/cordis.patch.yml")" = "1"

      - name: A home without the harness module tree is refused, not half-written
        run: |
          set -eu
          BARE="$RUNNER_TEMP/bare-home"
          mkdir -p "$BARE/profiles/web"
          if node install.mjs --dsh-home "$BARE" > "$RUNNER_TEMP/bare.log" 2>&1; then
            echo "::error::the installer accepted a home its packages could not import from"; exit 1
          fi
          grep -q 'requirement' "$RUNNER_TEMP/bare.log"
          test ! -d "$BARE/profiles/plugins/dsh-remote-ssh"

  yaml:
    name: composition template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the check's own dependency
        run: npm install --no-audit --no-fund --no-package-lock
      - name: The template must resolve into a real composition
        run: node scripts/check-template.mjs

  absolute-paths:
    name: no machine-specific paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shipped code must not contain a home directory
        run: |
          set -eu
          # Only the code a user actually runs. `test/` and the Docker fixtures
          # legitimately name `/home/dsh`, because that is the account inside the
          # disposable container, not a path on anybody's machine.
          targets="packages/dsh-remote-ssh/lib packages/dsh-remote-ssh-ui/lib scripts install.mjs install.sh patch"
          if grep -RIn --exclude-dir=node_modules -E '(/Users/[a-z]|/home/[a-z]+/|C:\\\\Users)' $targets; then
            echo "::error::a machine-specific absolute path is committed"; exit 1
          fi
          echo "no machine-specific path found"

  windows-client:
    name: Windows client path
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-harness
      - name: Windows-specific transport expectations
        run: node test/windows-client.test.mjs

  portability-gate:
    name: portability-gate
    # Stable check name for branch protection: a matrix job's name changes with
    # the matrix, this one does not, so `main` can require exactly one context
    # per workflow instead of every expansion of every matrix.
    if: always()
    needs: [node-matrix, shell, yaml, absolute-paths, windows-client]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a required job failed, was cancelled, or was skipped"
          exit 1
      - run: echo "every required job passed"
