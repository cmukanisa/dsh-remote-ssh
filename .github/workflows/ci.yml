name: CI

# The always-green baseline: no SSH server, no network beyond the npm install of
# the harness, and no Docker. It runs the parser check and the unit suite on
# every supported Node on all three platforms, because those are the suites that
# CAN run everywhere — a red here is a real portability regression.
#
# Node 20 is deliberately absent: the harness itself requires ^22.19 || >=24, so
# a green Node 20 run would prove nothing about any supported deployment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/setup-harness
      - name: Static check
        run: node scripts/check-syntax.mjs
      - name: Unit suite
        run: node test/unit.test.mjs
      - name: Tailscale suite
        run: node test/tailscale.test.mjs
      - name: Windows-client transport expectations
        run: node test/windows-client.test.mjs
      - name: Installer suite
        run: node test/install.test.mjs

  ci-gate:
    name: ci-gate
    # Stable check name for branch protection: a matrix job's name changes with
    # the matrix, this one does not, so `main` can require exactly one context
    # per workflow instead of every expansion of every matrix.
    if: always()
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a required job failed, was cancelled, or was skipped"
          exit 1
      - run: echo "every required job passed"
